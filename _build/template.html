<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>延长石油招聘 · 套卷模考</title>
<style>
:root{
  --bg:#f4f6fa; --card:#ffffff; --ink:#1b2333; --ink2:#5a6478; --line:#e3e8f0;
  --brand:#2f6df6; --brand-soft:#e8f0ff; --ok:#12a454; --ok-soft:#e6f8ef;
  --bad:#e8483f; --bad-soft:#fdeceb; --warn:#f0a020; --warn-soft:#fff6e5;
  --ai:#7b5cf0; --ai-soft:#f0ecff;
  --shadow:0 2px 10px rgba(24,40,72,.07); --radius:14px;
  --tint1:rgba(47,109,246,.10); --tint2:rgba(123,92,240,.09);
  --c1:#2f6df6; --c2:#0ea5a4; --c3:#f59e0b; --c4:#8b5cf6; --c5:#ec4899; --c6:#10b981;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#12151c; --card:#1a1f29; --ink:#e8ecf3; --ink2:#9aa5b8; --line:#2a3140;
    --brand:#5b8cff; --brand-soft:#1e2942; --ok:#3ddc84; --ok-soft:#14301f;
    --bad:#ff6b60; --bad-soft:#341a19; --warn:#ffbe4d; --warn-soft:#332812;
    --ai:#a48bff; --ai-soft:#241f3d;
    --tint1:rgba(91,140,255,.14); --tint2:rgba(164,139,255,.11);
    --c1:#5b8cff; --c2:#2dd4bf; --c3:#fbbf24; --c4:#a78bfa; --c5:#f472b6; --c6:#34d399;
    --shadow:0 2px 12px rgba(0,0,0,.35); }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg);color:var(--ink);
  font:15px/1.7 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  padding-bottom:env(safe-area-inset-bottom);
}
button{font:inherit;color:inherit;cursor:pointer;border:none;background:none}
input,textarea{font:inherit;color:inherit}
.wrap{max-width:1600px;margin:0 auto;padding:0 clamp(14px,2.4vw,40px);width:100%}

header{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--bg) 88%,transparent);
  backdrop-filter:saturate(1.4) blur(12px);border-bottom:1px solid var(--line)}
.hd{display:flex;align-items:center;gap:10px;height:54px}
.hd h1{font-size:16px;margin:0;font-weight:650;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.icon-btn{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;background:var(--card);box-shadow:var(--shadow);font-size:17px}

.hero{padding:26px 0 14px}
.hero h2{margin:0 0 6px;font-size:23px;letter-spacing:.3px}
.hero p{margin:0;color:var(--ink2);font-size:13.5px}
.stat-row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:18px 0 6px}
.stat{background:var(--card);border-radius:var(--radius);padding:14px 14px;box-shadow:var(--shadow);
  border-top:3px solid var(--brand);position:relative;overflow:hidden}
.stat:nth-child(2){border-top-color:var(--c2)}
.stat:nth-child(3){border-top-color:var(--c3)}
.stat b{display:block;font-size:21px;line-height:1.25;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--ink2)}

/* ---- 二级分类 ---- */
.catbtn{
  display:flex;align-items:center;gap:13px;width:100%;position:relative;overflow:hidden;
  background:var(--card);border-radius:18px;padding:16px 16px;box-shadow:var(--shadow);text-align:left;
  border-top:3px solid var(--accent,var(--brand));min-height:96px;
  transition:transform .14s ease, box-shadow .14s ease;
}
.catbtn:hover{transform:translateY(-2px);box-shadow:0 10px 24px rgba(24,40,72,.13)}
.catbtn::after{
  content:'';position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(100deg, color-mix(in srgb, var(--accent,var(--brand)) 15%, transparent) 0%, transparent 52%);
}
.catbtn .cicon{
  width:46px;height:46px;flex:none;border-radius:14px;display:grid;place-items:center;font-size:21px;
  background:color-mix(in srgb, var(--accent,var(--brand)) 17%, var(--card));position:relative;z-index:1;
}
.catbtn .ct{flex:1;min-width:0;position:relative;z-index:1;display:flex;flex-direction:column;gap:2px}
.catbtn .cn{font-size:16px;font-weight:750;line-height:1.35}
.catbtn .cm{font-size:12px;color:var(--ink2)}
.catbtn .cring{
  width:48px;height:48px;flex:none;border-radius:50%;display:grid;place-items:center;position:relative;z-index:1;
  font-size:11.5px;font-weight:750;font-variant-numeric:tabular-nums;color:var(--accent,var(--brand));
  background:conic-gradient(var(--accent,var(--brand)) calc(var(--p,0) * 1%), var(--line) 0);
}
.catbtn .cring::before{content:'';position:absolute;inset:4px;border-radius:50%;background:var(--card)}
.catbtn .cring b{position:relative;z-index:1;font-weight:750}
.catbtn .chev{transition:transform .18s ease;color:var(--ink2);font-size:14px;position:relative;z-index:1}
.catbtn.open .chev{transform:rotate(90deg)}
@media (max-width:520px){
  .catbtn{gap:10px;padding:12px 13px;border-radius:16px}
  .catbtn .cicon{width:38px;height:38px;font-size:17px;border-radius:12px}
  .catbtn .cn{font-size:14.5px}
  .catbtn .cring{width:42px;height:42px;font-size:10.5px}
}
.subwrap{overflow:hidden;display:none}
.subwrap.open{display:block}
.cat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.cat-grid .catbtn{margin-top:0}
.sec-title{display:flex;align-items:center;gap:10px;margin:22px 0 12px;font-size:13px;font-weight:700;color:var(--ink2)}
.sec-title .ln{flex:1;height:1px;background:var(--line)}
.quick-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px;margin-top:14px}
.panel.quick{cursor:pointer;display:flex;flex-direction:column;gap:4px;position:relative;overflow:hidden;
  border-top:3px solid var(--brand);transition:transform .14s ease, box-shadow .14s ease}
.panel.quick:hover{transform:translateY(-2px);box-shadow:0 10px 24px rgba(24,40,72,.13)}
.panel.quick:nth-child(2){border-top-color:var(--c3)}
.quick .qh{display:flex;align-items:center;gap:9px;font-size:15.5px;font-weight:750}
.quick .qico{font-size:19px}
.quick .qgo{margin-top:8px;font-size:12.5px;font-weight:650;color:var(--brand)}
.panel.quick:nth-child(2) .qgo{color:var(--c3)}
.cat-head{display:flex;align-items:center;gap:14px;margin-top:16px;position:relative;overflow:hidden;
  border-left:4px solid var(--accent,var(--brand))}
.cat-head::after{content:'';position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(100deg, color-mix(in srgb, var(--accent,var(--brand)) 13%, transparent), transparent 55%)}
.cat-head .ch-t{flex:1;min-width:0;position:relative;z-index:1}
.cat-head .ch-n{font-size:18px;font-weight:800}
.cat-head .cicon.big{width:56px;height:56px;font-size:25px;border-radius:17px}
.cat-head .cring.big{width:60px;height:60px;font-size:13px}
.subhd{display:flex;align-items:center;gap:8px;margin:14px 4px 8px;font-size:12.5px;font-weight:650;color:var(--ink2)}
.subhd .ln{height:1px;background:var(--line);flex:1}
.subhd .cnt{font-weight:500;font-size:11.5px;background:var(--card);padding:2px 8px;border-radius:20px;box-shadow:var(--shadow)}

.paper-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(258px,1fr));gap:12px}
.paper{display:flex;flex-direction:column;gap:8px;background:var(--card);border-radius:16px;
  padding:15px 16px 13px;box-shadow:var(--shadow);text-align:left;width:100%;min-height:136px;
  border-top:3px solid var(--accent,var(--brand));
  transition:transform .14s ease, box-shadow .14s ease}
.paper:hover{transform:translateY(-2px);box-shadow:0 10px 24px rgba(24,40,72,.13)}
.paper:active{transform:scale(.99)}
.paper .name{font-size:14.5px;font-weight:650;line-height:1.45;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.paper .meta{margin-top:2px;display:flex;gap:6px;flex-wrap:wrap}
.paper .meta span{font-size:11.5px;color:var(--ink2);background:var(--bg);padding:2px 8px;border-radius:20px}
.paper .pfoot{margin-top:auto;display:flex;align-items:center;justify-content:space-between;gap:8px}
.paper .go{font-size:12px;font-weight:650;color:var(--accent,var(--brand))}
.paper .ring{width:34px;height:34px;flex:none;border-radius:50%;display:grid;place-items:center;
  font-size:11px;font-weight:700;background:color-mix(in srgb, var(--accent,var(--brand)) 14%, var(--card));
  color:var(--accent,var(--brand));font-variant-numeric:tabular-nums}
.paper .ring.done{background:var(--ok-soft);color:var(--ok)}

.panel{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;margin:14px 0}
.qhead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.qhead .pos{font-size:12.5px;color:var(--ink2);font-variant-numeric:tabular-nums}
.chip{font-size:12px;padding:3px 9px;border-radius:20px;background:var(--bg);color:var(--ink2);
  font-variant-numeric:tabular-nums;display:inline-flex;align-items:center;gap:4px}
.chip.live{background:var(--warn-soft);color:var(--warn)}
.badge{font-size:11.5px;padding:3px 9px;border-radius:20px;background:var(--brand-soft);color:var(--brand);font-weight:600}
.badge.ok{background:var(--ok-soft);color:var(--ok)}
.badge.bad{background:var(--bad-soft);color:var(--bad)}
.qtext{font-size:16px;line-height:1.8;white-space:pre-wrap;word-break:break-word}
.opts{display:flex;flex-direction:column;gap:9px;margin-top:14px}
@media (min-width:1000px){
  .opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .opts .opt{height:100%}
  .qtext{font-size:16.5px}
  .panel{padding:20px 22px}
}
.opt{display:flex;gap:11px;align-items:flex-start;text-align:left;width:100%;
  padding:12px 13px;border:1.5px solid var(--line);border-radius:11px;background:transparent;
  transition:border-color .12s,background .12s}
.opt:active{background:var(--brand-soft)}
.opt .k{flex:none;width:23px;height:23px;border-radius:50%;display:grid;place-items:center;
  font-size:12.5px;font-weight:700;border:1.5px solid var(--line);color:var(--ink2);margin-top:1px}
.opt.multi .k{border-radius:6px}
.opt .v{flex:1;line-height:1.65;font-size:14.7px;word-break:break-word}
.opt.sel{border-color:var(--brand);background:var(--brand-soft)}
.opt.sel .k{background:var(--brand);border-color:var(--brand);color:#fff}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.right .k{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .k{background:var(--bad);border-color:var(--bad);color:#fff}

.fb{margin-top:14px;border-radius:11px;padding:12px 13px;font-size:13.7px;line-height:1.75;display:none;white-space:pre-wrap}
.fb.show{display:block}
.fb.ok{background:var(--ok-soft)}
.fb.bad{background:var(--bad-soft)}
.fb .ttl{font-weight:700;margin-bottom:4px}
.fb.ok .ttl{color:var(--ok)}
.fb.bad .ttl{color:var(--bad)}
.fb .ex{color:var(--ink2);margin-top:6px}
.fb .proc{margin-top:8px;padding:9px 11px;border-radius:9px;background:var(--warn-soft);
  border-left:3px solid var(--warn);font-size:13.2px;line-height:1.75;color:var(--ink)}
.fb .proc .pt{font-weight:700;color:var(--warn);margin-bottom:3px;font-size:12.5px}
.fb .ex .tagfill{display:inline-block;font-size:11px;font-weight:700;color:var(--ai);background:var(--ai-soft);
  border-radius:20px;padding:0 7px;margin-right:5px;vertical-align:1px}
.fb details{margin-top:6px}
.fb summary{cursor:pointer;color:var(--ink2);font-size:12.5px}
.fb .raw{margin-top:6px;padding:8px 10px;border-radius:9px;background:var(--bg);color:var(--ink2);
  font-size:12.5px;line-height:1.7}
.fb .tm{display:inline-flex;align-items:center;gap:4px;margin-left:8px;font-size:12px;
  background:var(--card);padding:1px 8px;border-radius:20px;color:var(--ink2);font-weight:500}
/* 无答案题（题本版）：中性提示，不判对错 */
.fb.na{background:var(--warn-soft)}
.fb.na .ttl{color:var(--warn)}
.cell.na{background:var(--warn-soft);border-style:dashed;border-color:var(--warn);color:var(--warn)}
.badge.na{background:var(--warn-soft);color:var(--warn)}

/* ---- AI ---- */
.ai{margin-top:12px;border:1.5px dashed var(--ai);border-radius:12px;padding:12px 13px;background:var(--ai-soft)}
.ai-hd{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;color:var(--ai)}
.ai-hd .sp{flex:1}
.ai-hd .mini{font-size:11.5px;font-weight:500;color:var(--ink2);background:var(--card);
  padding:3px 10px;border-radius:20px;box-shadow:var(--shadow)}
.ai-out{margin-top:9px;font-size:13.5px;line-height:1.78;color:var(--ink);display:none;word-break:break-word}
.ai-out.show{display:block}
.ai-out b{color:var(--ink)}
.ai-out .math{font-family:"Cambria Math","Times New Roman",serif;font-size:1.04em}
.ai-out .mathblock{text-align:center;margin:6px 0;font-family:"Cambria Math","Times New Roman",serif}
.ai-out sup{font-size:.72em;vertical-align:super;line-height:0}
.ai-out sub{font-size:.72em;vertical-align:sub;line-height:0}
.frac{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;
  font-size:.92em;line-height:1.15;margin:0 3px;position:relative;top:-.05em}
.frac .num{border-bottom:1px solid currentColor;padding:0 3px}
.frac .den{padding:0 3px}
.ai-warn{margin-top:8px;font-size:12.5px;line-height:1.7;color:var(--warn);
  background:var(--warn-soft);border-radius:9px;padding:8px 10px;display:none}
.ai-warn.show{display:block}
.ai-tools{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.ai-tools button{font-size:12px;padding:5px 12px;border-radius:20px;background:var(--card);
  color:var(--ink2);box-shadow:var(--shadow)}
.ai-links{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.linkbtn{font-size:12px;padding:5px 12px;border-radius:20px;background:var(--card);
  color:var(--brand);box-shadow:var(--shadow);text-decoration:none;display:inline-block}
.linkbtn:active{opacity:.7}
.ai-row{display:flex;gap:8px;margin-top:9px}
.ai-row input{flex:1;min-width:0;background:var(--card);border:1.5px solid var(--line);border-radius:10px;
  padding:9px 11px;font-size:13.5px;outline:none}
.ai-row input:focus{border-color:var(--ai)}
.ai-row button{flex:none;padding:0 15px;border-radius:10px;background:var(--ai);color:#fff;font-size:13.5px;font-weight:650}
.ai-err{margin-top:8px;font-size:12.5px;line-height:1.7;color:var(--bad)}
.spin{display:inline-block;width:13px;height:13px;border:2px solid var(--ai);border-right-color:transparent;
  border-radius:50%;animation:sp .7s linear infinite;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}

.rndbar{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ink2);
  background:var(--brand-soft);border-radius:20px;padding:4px 12px;font-variant-numeric:tabular-nums}
.rndbar b{color:var(--brand)}
.sumrow{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.sumrow .kv b{font-size:24px}
.q-layout{display:grid;gap:14px;align-items:start}
@media (min-width:1100px){
  .q-layout{grid-template-columns:minmax(0,1fr) 296px}
  .side{position:sticky;top:70px}
}
@media (max-width:1099px){ .side{display:none} }
.side .kv2{display:flex;align-items:baseline;justify-content:space-between;padding:7px 0;
  border-bottom:1px dashed var(--line);font-size:13px}
.side .kv2:last-child{border-bottom:none}
.side .kv2 b{font-variant-numeric:tabular-nums;font-size:15px}
.side .ttl{font-size:12px;font-weight:700;color:var(--ink2);letter-spacing:.4px;margin-bottom:6px}
.navbar{display:flex;gap:10px;position:sticky;bottom:0;padding:12px 0 calc(12px + env(safe-area-inset-bottom));
  background:linear-gradient(to top,var(--bg) 72%,transparent);z-index:20}
.btn{flex:1;height:46px;border-radius:12px;font-size:15px;font-weight:650;display:grid;place-items:center}
.btn.primary{background:var(--brand);color:#fff;box-shadow:0 3px 12px rgba(47,109,246,.32)}
.btn.ghost{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.btn:disabled{opacity:.45;box-shadow:none}

.timer{display:flex;align-items:center;gap:6px;font-variant-numeric:tabular-nums;font-weight:700;font-size:14.5px;
  background:var(--card);padding:7px 12px;border-radius:11px;box-shadow:var(--shadow)}
.timer.warn{color:var(--bad);animation:pulse 1.4s infinite}
@keyframes pulse{50%{opacity:.55}}

.pbar{height:4px;background:var(--line);border-radius:4px;overflow:hidden;margin:12px 0 4px}
.pbar i{display:block;height:100%;background:var(--brand);border-radius:4px;transition:width .25s}

.sheet{display:grid;grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:8px}
.cell{aspect-ratio:1;border-radius:9px;display:grid;place-items:center;font-size:13px;font-weight:650;
  background:var(--bg);border:1.5px solid var(--line);font-variant-numeric:tabular-nums}
.cell.done{background:var(--brand);border-color:var(--brand);color:#fff}
.cell.cur{outline:2.5px solid var(--brand);outline-offset:2px}
.cell.ok{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.cell.bad{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}

.score{text-align:center;padding:16px 0}
.score .big{font-size:46px;font-weight:800;line-height:1.1;font-variant-numeric:tabular-nums}
.score .sub{color:var(--ink2);font-size:13px;margin-top:4px}
.grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:16px}
.kv{background:var(--card);border-radius:12px;padding:13px;box-shadow:var(--shadow);text-align:center}
.kv b{display:block;font-size:20px;font-variant-numeric:tabular-nums}
.kv span{font-size:12px;color:var(--ink2)}
.empty{text-align:center;color:var(--ink2);padding:60px 20px;font-size:14px}
.hint{font-size:12.5px;color:var(--ink2);line-height:1.7}
.wlist{display:flex;flex-direction:column;gap:10px}
.wcard{background:var(--card);border-radius:12px;padding:14px;box-shadow:var(--shadow)}
.wcard .meta{font-size:11.5px;color:var(--ink2);margin-bottom:6px;display:flex;gap:8px;flex-wrap:wrap}
.wcard .myst{color:var(--bad);font-weight:650}
.wcard .right{color:var(--ok);font-weight:650}

/* ---- 设置 ---- */
.field{margin-bottom:14px}
.field label{display:block;font-size:12.5px;font-weight:650;color:var(--ink2);margin-bottom:5px}
.field input{width:100%;background:var(--bg);border:1.5px solid var(--line);border-radius:10px;
  padding:10px 12px;font-size:14px;outline:none}
.field input:focus{border-color:var(--brand)}
.presets{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:16px}
.preset{font-size:12.5px;padding:6px 12px;border-radius:20px;background:var(--bg);border:1.5px solid var(--line)}
.preset.on{background:var(--ai-soft);border-color:var(--ai);color:var(--ai);font-weight:650}
.note{font-size:12px;line-height:1.75;color:var(--ink2);background:var(--bg);border-radius:10px;padding:11px 12px}
.note b{color:var(--ink)}
.toast{position:fixed;left:50%;bottom:76px;transform:translateX(-50%);z-index:99;
  background:rgba(20,26,40,.92);color:#fff;font-size:13.5px;padding:10px 18px;border-radius:22px;
  opacity:0;pointer-events:none;transition:opacity .2s ease}
.toast.show{opacity:1}
footer{text-align:center;color:var(--ink2);font-size:12px;padding:26px 0 34px}

/* ==================== 阅读学习板块 ==================== */
.seg{display:flex;gap:4px;background:var(--card);border-radius:14px;padding:5px;box-shadow:var(--shadow);margin:16px 0 0;overflow:hidden}
.seg button{flex:1 1 0;min-width:0;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;gap:5px;
  font-size:13px;font-weight:700;color:var(--ink2);white-space:nowrap;transition:background .15s,color .15s}
.seg button.on{background:var(--brand-soft);color:var(--brand)}
.seg .sico{font-size:15px}

.st-hero{padding:22px 0 6px}
.st-hero h2{margin:0 0 6px;font-size:22px;letter-spacing:.3px}
.st-hero p{margin:0;color:var(--ink2);font-size:13.5px;line-height:1.7}
.st-sum{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:16px 0 4px}
.mat-list{display:grid;gap:10px}
.mat{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:var(--card);
  border-radius:14px;padding:12px 13px;box-shadow:var(--shadow);
  transition:transform .12s ease,box-shadow .12s ease}
.mat:active{transform:scale(.995)}
.mat .ic{width:38px;height:48px;flex:none;border-radius:8px;display:grid;place-items:center;color:#fff;
  background:linear-gradient(160deg,#f2615a,#c9362e);font-size:9.5px;font-weight:800;letter-spacing:.6px;
  box-shadow:0 2px 6px rgba(201,54,46,.28);position:relative;overflow:hidden}
.mat .ic.doc{background:linear-gradient(160deg,#5b8cff,#2b57c4);box-shadow:0 2px 6px rgba(43,87,196,.28)}
.mat .ic i{position:absolute;top:0;right:0;width:0;height:0;border-style:solid;
  border-width:0 11px 11px 0;border-color:transparent rgba(255,255,255,.6) transparent transparent}
.mat .mb{flex:1;min-width:0}
.mat .mtt{font-size:14.5px;font-weight:700;line-height:1.45;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.mat .mm{margin-top:4px;display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:11.5px;color:var(--ink2)}
.mat .mm span{background:var(--bg);padding:2px 8px;border-radius:20px}
.mat .mm .cont{background:var(--warn-soft);color:var(--warn);font-weight:650}
.mat .mm .fin{background:var(--ok-soft);color:var(--ok);font-weight:650}
.mat .prog{display:block;height:3px;border-radius:3px;background:var(--line);margin-top:7px;overflow:hidden}
.mat .prog i{display:block;height:100%;background:var(--accent,var(--brand));border-radius:3px;transition:width .3s}
.mat .go{flex:none;font-size:12px;font-weight:700;color:var(--accent,var(--brand));white-space:nowrap}

/* ---- 阅读器 ---- */
.pd{display:flex;flex-direction:column;height:calc(100vh - 58px);height:calc(100dvh - 58px);gap:8px;margin-top:4px}
.pd-top{display:flex;align-items:center;gap:8px}
.pd-title{flex:1;min-width:0;font-size:13.5px;font-weight:700;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pd-page{display:flex;align-items:center;gap:3px;font-size:12.5px;color:var(--ink2);background:var(--card);
  border-radius:20px;padding:4px 10px;box-shadow:var(--shadow);font-variant-numeric:tabular-nums;white-space:nowrap}
.pd-page input{width:36px;border:none;background:transparent;text-align:right;font:inherit;font-weight:700;
  color:var(--ink);outline:none;padding:0}
.pd-btn{width:34px;height:34px;flex:none;border-radius:11px;background:var(--card);box-shadow:var(--shadow);
  display:grid;place-items:center;font-size:14px;font-weight:700;color:var(--ink2)}
.pd-btn:disabled{opacity:.4}
.pd-stage{flex:1;min-height:0;overflow:auto;background:var(--line);border-radius:12px;
  -webkit-overflow-scrolling:touch;position:relative}
.pd-in{width:max-content;margin:0 auto;padding:10px}
.pd-stage canvas{display:block;background:#fff;border-radius:4px;box-shadow:0 3px 14px rgba(20,30,50,.16)}
.pd-load{position:absolute;inset:0;display:grid;place-items:center;text-align:center;font-size:13px;
  color:var(--ink2);background:color-mix(in srgb,var(--line) 82%,transparent);pointer-events:none;padding:16px}
.pd-bar{display:flex;align-items:center;gap:10px;padding-bottom:env(safe-area-inset-bottom)}
.pd-nav{flex:none;height:42px;padding:0 14px;border-radius:12px;background:var(--card);box-shadow:var(--shadow);
  font-size:13.5px;font-weight:650}
.pd-nav:disabled{opacity:.4}
.pd-range{flex:1;min-width:0;height:32px;accent-color:var(--brand)}
.pd-hint{font-size:11.5px;color:var(--ink2);text-align:center;padding-bottom:6px}
@media (min-width:900px){ .mat-list{grid-template-columns:1fr 1fr} }

/* ======================== 动效与细节（2026-11-15） ======================== */
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes popIn{0%{transform:scale(.97);opacity:.55}100%{transform:scale(1);opacity:1}}
@keyframes ringIn{from{opacity:0;transform:rotate(-28deg) scale(.86)}to{opacity:1;transform:none}}
@keyframes glowPulse{0%,100%{box-shadow:0 0 0 0 rgba(47,109,246,0)}50%{box-shadow:0 0 0 5px rgba(47,109,246,.12)}}
@keyframes sheen{from{background-position:-120% 0}to{background-position:220% 0}}
#app.swap > *{animation:fadeUp .34s cubic-bezier(.22,.61,.36,1) both}
#app.swap > *:nth-child(2){animation-delay:.045s}
#app.swap > *:nth-child(3){animation-delay:.09s}
#app.swap > *:nth-child(4){animation-delay:.13s}
#app.swap > *:nth-child(5){animation-delay:.17s}
#app.swap > *:nth-child(6){animation-delay:.21s}
.q-layout > *{animation:none}
.btn{transition:transform .14s ease,box-shadow .22s ease,filter .2s ease}
.btn:not(:disabled):hover{transform:translateY(-1px);filter:brightness(1.03)}
.btn:not(:disabled):active{transform:translateY(0) scale(.985)}
.seg button{transition:background .18s,color .18s,transform .16s}
.seg button:active{transform:scale(.97)}
.catbtn .cicon{transition:transform .26s cubic-bezier(.34,1.56,.64,1)}
.catbtn:hover .cicon{transform:scale(1.1) rotate(-4deg)}
.catbtn .cring{animation:ringIn .5s cubic-bezier(.22,.61,.36,1) both}
.catbtn .cring::after{content:'';position:absolute;inset:-2px;border-radius:50%;border:2px solid transparent;transition:border-color .2s,opacity .2s;opacity:0}
.catbtn:hover .cring::after{border-color:var(--accent,var(--brand));opacity:.55}
.catbtn:active{transform:translateY(0) scale(.997)}
.paper{transition:transform .18s ease,box-shadow .24s ease}
.paper .ring{transition:transform .2s ease}
.paper:hover .ring{transform:scale(1.07)}
.pagerow .pbar i,.pbar i{background:linear-gradient(90deg,var(--brand),color-mix(in srgb,var(--brand) 55%,#7bd0ff));transition:width .55s cubic-bezier(.22,.61,.36,1)}
.opt{transition:border-color .16s ease,background .2s ease,transform .12s ease,box-shadow .2s ease}
.opt:active{transform:scale(.995)}
@media (hover:hover){
  .opt:not(:disabled):hover{border-color:var(--brand);background:var(--brand-soft);transform:translateX(2px)}
}
.opt.right{animation:popIn .3s ease both}
.opt.wrong{animation:popIn .3s ease both}
.fb.show{animation:fadeUp .28s ease both}
.qtext{animation:fadeUp .3s ease both}
.badge.done{background:var(--ok-soft);color:var(--ok)}
.chip.live{animation:glowPulse 2.4s ease-in-out infinite}
.paper .meta .done-tag{background:var(--ok-soft);color:var(--ok);font-weight:650}
.hero h2{background:linear-gradient(92deg,var(--ink) 6%,var(--brand) 96%);-webkit-background-clip:text;background-clip:text;color:transparent}
body{background:radial-gradient(900px 480px at 50% -180px,rgba(47,109,246,.10),transparent 72%),
  radial-gradient(760px 420px at 100% 0,rgba(123,92,240,.07),transparent 70%),var(--bg)}
.btn.primary{background:linear-gradient(135deg,var(--brand),color-mix(in srgb,var(--brand) 72%,#7bd0ff))}
.sec-title::before{content:'';width:4px;height:14px;border-radius:2px;background:linear-gradient(180deg,var(--brand),var(--c4))}
.quick .qico{transition:transform .28s cubic-bezier(.34,1.56,.64,1)}
.panel.quick:hover .qico{transform:rotate(-9deg) scale(1.14)}
.rndbar b{font-variant-numeric:tabular-nums}
.sheet .cell{font-variant-numeric:tabular-nums}
.stat{transition:transform .2s ease,box-shadow .22s ease}
.stat:hover{transform:translateY(-2px)}
.qhead .badge,.qhead .chip{animation:fadeUp .26s ease both}
.sheet .cell{transition:transform .15s ease,background .2s ease,border-color .2s ease}
.sheet .cell:hover{transform:translateY(-2px)}
.panel{transition:box-shadow .24s ease}
.mode-card{transition:transform .2s ease}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}
}

/* ===================== 2026-11-16 UI 重构（对照设计稿） ===================== */
:root{
  --bg:#f3f6fc; --card:#ffffff; --ink:#0f1b33; --ink2:#6b7791; --line:#e8edf6;
  --brand:#2f6df6; --brand-weak:#eaf1ff; --grad:linear-gradient(135deg,#3f8cff 0%,#1f5be0 100%);
  --shadow:0 6px 20px rgba(19,45,100,.07); --radius:18px;
  --c1:#2f6df6;--c2:#0ea5a4;--c3:#f59e0b;--c4:#8b5cf6;--c5:#ec4899;--c6:#10b981;
}
@media (prefers-color-scheme:dark){
  :root{ --bg:#0f131b; --card:#171d28; --ink:#e9eefb; --ink2:#98a4bb; --line:#232b3a;
    --brand-weak:#1b2740; --shadow:0 6px 20px rgba(0,0,0,.38); }
}
body{background:var(--bg)}
.wrap{max-width:820px}
/* 顶部渐变 hero */
.hero2{position:relative;overflow:hidden;color:#fff;background:var(--grad);
  border-radius:0 0 26px 26px;padding:14px 0 46px;
  margin-left:calc(-1 * clamp(14px,2.4vw,40px));margin-right:calc(-1 * clamp(14px,2.4vw,40px));
  padding-left:clamp(14px,2.4vw,40px);padding-right:clamp(14px,2.4vw,40px)}
.hero2::before,.hero2::after{content:'';position:absolute;border-radius:50%;pointer-events:none}
.hero2::before{width:230px;height:230px;right:-70px;top:-110px;background:rgba(255,255,255,.10)}
.hero2::after{width:150px;height:150px;right:66px;top:36px;background:rgba(255,255,255,.07)}
.hero2 .inner{position:relative;z-index:1}
.h2top{display:flex;align-items:center;gap:10px}
.avatar{width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.20);
  display:grid;place-items:center;font-size:15px;font-weight:750;border:1.5px solid rgba(255,255,255,.38);flex:none}
.h2who{flex:1;line-height:1.35;min-width:0}
.h2who b{display:block;font-size:15px;font-weight:750}
.h2who span{font-size:11.5px;opacity:.85}
.h2btn{width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.16);color:#fff;
  display:grid;place-items:center;font-size:16px;flex:none}
.hero2 h2{font-size:27px;margin:16px 0 4px;font-weight:800;letter-spacing:.6px;line-height:1.2}
.hero2 p{margin:0;font-size:13px;opacity:.88}
/* 页面主体 */
.app-pad{padding-bottom:152px}
.page{position:relative;z-index:1}
.searchbar{display:flex;align-items:center;gap:9px;background:var(--card);border-radius:14px;
  padding:12px 14px;box-shadow:0 6px 18px rgba(23,55,120,.08);color:var(--ink2);font-size:13.5px;
  margin-top:14px;cursor:text}
.searchbar input{flex:1;min-width:0;border:0;outline:0;background:transparent;color:var(--ink);font-size:13.5px}
.circle-row{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:18px 0 2px}
.circ{display:flex;flex-direction:column;align-items:center;gap:7px;color:var(--ink);font-size:12px;font-weight:650;background:none}
.circ i{width:54px;height:54px;border-radius:50%;display:grid;place-items:center;font-size:22px;
  background:linear-gradient(145deg,#eaf1ff,#dce8ff);color:var(--brand);box-shadow:0 5px 14px rgba(47,109,246,.12);
  transition:transform .2s cubic-bezier(.34,1.56,.64,1),box-shadow .2s}
.circ:active i{transform:scale(.93)}
.circ:nth-child(2) i{background:linear-gradient(145deg,#e7f8f4,#d3f1e9);color:#0d9488;box-shadow:0 5px 14px rgba(13,148,136,.12)}
.circ:nth-child(3) i{background:linear-gradient(145deg,#fff3e3,#ffe8ca);color:#d97706;box-shadow:0 5px 14px rgba(217,119,6,.12)}
.circ:nth-child(4) i{background:linear-gradient(145deg,#f3edff,#e7ddff);color:#7c3aed;box-shadow:0 5px 14px rgba(124,58,237,.12)}
.sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:22px 0 10px}
.sec-head b{font-size:16.5px;font-weight:800;letter-spacing:.2px}
.sec-head a,.sec-head span{font-size:12px;color:var(--ink2)}
.feature{background:var(--card);border-radius:18px;box-shadow:0 8px 24px rgba(23,55,120,.09);padding:16px;border:1px solid rgba(47,109,246,.06)}
.feature .ft{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.feature .fname{font-size:16px;font-weight:750;line-height:1.45}
.taglvl{font-size:11px;padding:2px 9px;border-radius:9px;background:var(--brand-weak);color:var(--brand);font-weight:700;white-space:nowrap}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}
.chips span{font-size:11px;padding:2px 9px;border-radius:20px;background:var(--bg);color:var(--ink2)}
.fstats{display:flex;gap:22px;margin-top:13px}
.fstats div b{display:block;font-size:18px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.3}
.fstats div span{font-size:11px;color:var(--ink2)}
.fnote{font-size:11.5px;color:var(--ink2);margin-top:10px}
.cta{width:100%;height:48px;border-radius:14px;background:var(--grad);color:#fff;font-size:15.5px;font-weight:750;
  box-shadow:0 10px 22px rgba(47,109,246,.30);margin-top:14px;transition:transform .15s}
.cta:active{transform:scale(.99)}
.link-btn{font-size:12.5px;color:var(--brand);font-weight:650}
/* 底部导航 */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:40;display:grid;grid-template-columns:repeat(4,1fr);
  background:color-mix(in srgb,var(--card) 94%,transparent);backdrop-filter:blur(14px) saturate(1.5);
  border-top:1px solid var(--line);padding:7px 6px calc(7px + env(safe-area-inset-bottom))}
@media (min-width:760px){
  .tabbar{max-width:820px;left:50%;transform:translateX(-50%);border-radius:18px 18px 0 0;
    box-shadow:0 -8px 26px rgba(23,55,120,.10)}
}
.tabit{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;color:var(--ink2);
  font-weight:650;padding:3px 0;border-radius:10px;transition:transform .15s,color .15s}
.tabit i{font-size:19px;line-height:1;font-style:normal}
.tabit.on{color:var(--brand)}
.tabit:active{transform:scale(.93)}
/* 分类标签 */
.ktag{font-size:10.5px;padding:2px 8px;border-radius:8px;font-weight:700;background:var(--brand-weak);color:var(--brand);white-space:nowrap}
.ktag.politics{background:#eef2ff;color:#4f46e5}
.ktag.common{background:#ecfdf5;color:#059669}
.ktag.verbal{background:#eff6ff;color:#2563eb}
.ktag.quant{background:#fff7ed;color:#ea580c}
.ktag.logic{background:#f5f3ff;color:#7c3aed}
.ktag.data{background:#ecfeff;color:#0891b2}
.ktag.gongji{background:#fef2f2;color:#dc2626}
.ktag.major{background:#fdf4ff;color:#a21caf}
@media (prefers-color-scheme:dark){
  .ktag{background:#1d2740}
  .circ i{background:rgba(91,140,255,.16);box-shadow:none}
}
/* 个人中心 */
.pstats{display:grid;grid-template-columns:repeat(4,1fr);background:var(--card);border-radius:18px;
  box-shadow:0 8px 24px rgba(23,55,120,.10);padding:14px 4px;margin-top:-26px;position:relative;z-index:2}
.pstats div{text-align:center}
.pstats b{display:block;font-size:17px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.35}
.pstats span{font-size:10.5px;color:var(--ink2)}
.quick-icons{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;background:var(--card);
  border-radius:16px;padding:14px 6px;margin-top:12px;box-shadow:var(--shadow)}
.qi{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11px;color:var(--ink);background:none}
.qi i{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-size:17px;font-style:normal;
  background:var(--brand-weak);color:var(--brand);transition:transform .18s}
.qi:active i{transform:scale(.92)}
.goal-card{background:var(--card);border-radius:16px;padding:14px;margin-top:12px;box-shadow:var(--shadow)}
.goal-row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.goal-row b{font-size:14.5px}
.goal-btn{background:var(--brand);color:#fff;border-radius:10px;padding:8px 14px;font-size:12.5px;font-weight:750;flex:none}
.chart{display:flex;align-items:flex-end;gap:10px;height:118px;margin-top:14px}
.chart .bar{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:6px;height:100%}
.chart .bar i{width:100%;max-width:26px;border-radius:8px;background:linear-gradient(180deg,#7aa8ff,#3b6ff0);min-height:6px}
.chart .bar span{font-size:10px;color:var(--ink2)}
/* 阅读学习 */
.st-tabs{display:flex;gap:15px;margin:14px 0 4px;overflow-x:auto;scrollbar-width:none;padding:0 1px}
.st-tabs button{font-size:14px;color:var(--ink2);padding:4px 0 6px;white-space:nowrap;position:relative;background:none}
.st-tabs button.on{color:var(--brand);font-weight:750}
.st-tabs button.on::after{content:'';position:absolute;left:0;right:0;bottom:0;height:3px;border-radius:3px;background:var(--brand)}
.mat2{display:flex;gap:12px;align-items:center;background:var(--card);border-radius:16px;padding:12px;
  box-shadow:var(--shadow);text-align:left;width:100%;transition:transform .16s}
.mat2:active{transform:scale(.995)}
.cover{width:54px;height:54px;border-radius:13px;flex:none;display:grid;place-items:center;font-size:23px;
  background:linear-gradient(145deg,#eaf1ff,#dbe7ff);color:var(--brand)}
.mat2 .mt2{flex:1;min-width:0}
.mat2 .mt2 b{display:block;font-size:14px;line-height:1.45;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mat2 .mt2 span{font-size:11.5px;color:var(--ink2)}
.stbar{height:4px;border-radius:4px;background:var(--line);overflow:hidden;margin-top:6px}
.stbar i{display:block;height:100%;background:var(--brand);border-radius:4px}
.status-pill{font-size:10.5px;padding:2px 8px;border-radius:20px;background:var(--brand-weak);color:var(--brand);font-weight:700;white-space:nowrap}

.weak-card .wt{flex:1;min-width:0}

<body>

<header>
  <div class="wrap hd">
    <button class="icon-btn" id="backBtn" style="display:none" onclick="goBack()" aria-label="返回">‹</button>
    <h1 id="hdTitle">套卷模考</h1>
    <div class="timer" id="timer" style="display:none">--:--</div>
    <button class="icon-btn" id="sheetBtn" style="display:none" onclick="toggleSheet()" aria-label="答题卡">☰</button>
    <button class="icon-btn" id="setBtn" onclick="openSettings()" aria-label="设置">⚙</button>
  </div>
</header>

<main class="wrap" id="app"></main>
<footer id="foot">题库由本地 PDF / DOC 试卷解析生成 · 答案以原卷为准</footer>
<div class="toast" id="toast"></div>

<script id="bank" type="application/json">__BANK__</script>
<script id="study" type="application/json">__STUDY__</script>
<script id="drill" type="application/json">__DRILL__</script>
<script>
"use strict";
/* ============================ 基础 ============================ */
const PAPERS = JSON.parse(document.getElementById('bank').textContent);
const DRILLS = JSON.parse(document.getElementById('drill').textContent || '[]');
const K = {
  prog: 'yp_exam_prog_v1',
  wrong: 'yp_exam_wrong_v1',
  ai: 'yp_ai_cfg_v1',
  aiCache: 'yp_ai_cache_v1',
  ui: 'yp_ui_v1',
  random: 'yp_random_v1',
  stats: 'yp_stats_v1',
  fav: 'yp_fav_v1',
  hist: 'yp_hist_v1',
};
const store = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} },
  del(k){ try{ localStorage.removeItem(k); }catch(e){} },
};

/* 相对时间：刚刚 / N 分钟前 / N 小时前 / M月D日 */
function fmtWhen(t){
  if (!t) return '';
  const diff = Date.now() - t;
  if (diff < 60e3) return '刚刚';
  if (diff < 3600e3) return Math.floor(diff / 60e3) + ' 分钟前';
  if (diff < 86400e3) return Math.floor(diff / 3600e3) + ' 小时前';
  const d = new Date(t);
  return (d.getMonth() + 1) + '月' + d.getDate() + '日';
}
const app = document.getElementById('app');
const hdTitle = document.getElementById('hdTitle');
const backBtn = document.getElementById('backBtn');
const timerEl = document.getElementById('timer');
const sheetBtn = document.getElementById('sheetBtn');
const setBtn = document.getElementById('setBtn');
const foot = document.getElementById('foot');

const esc = s => String(s == null ? '' : s)
  .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const LETTERS = ['A','B','C','D','E'];
const ACCENTS = ['var(--c1)','var(--c2)','var(--c3)','var(--c4)','var(--c5)','var(--c6)'];
const CAT_ICONS = { '历年真题':'📘', '公基模拟套卷':'🧮', '考前冲刺 EPI 全真':'🎯',
  '行测模拟卷':'📝', '历年试题汇编卷':'📚', '名师押题卷':'⭐', '错题复习':'🔁',
  '公基 · 分模块专项':'🏛', '公基 · 基础强化特训':'🧱', '公基 · 预测押题库':'🎯',
  '行测 · 分模块专项':'📐', '行测 · 必做 100 题':'💯', '行测 · 常识分类题库':'🧠',
  '行测 · EPI 综合能力题库':'⚡', '行测 · 专项预测押题':'📈' };
const fmtClock = s => { s = Math.max(0, s|0); return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0'); };
const fmtUse = ms => {
  if (ms == null) return '—';
  const s = ms / 1000;
  if (s < 60) return (s < 10 ? s.toFixed(1) : Math.round(s)) + ' 秒';
  return Math.floor(s/60) + ' 分 ' + Math.round(s%60) + ' 秒';
};
const norm = a => (a||'').split('').sort().join('');

let state = null;
let view = 'home';           // home | mode | q | sheet | result | wronglist | settings
let lastPaperId = null;
let lastCat = null;
let curBank = 'exam';   // exam=套卷模考 / drill=专项练习

function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(window.__toast);
  window.__toast = setTimeout(()=>t.classList.remove('show'), 2200);
}

/* ============================ 计时 ============================ */
function accrue(){
  if (!state || !state.enterAt) return;
  const d = Date.now() - state.enterAt;
  // 已作答的题不再累计（用时以首次作答那一刻为准）
  if (state.stopAt[state.pos] == null && d > 0 && d < 6*3600*1000){
    state.times[state.pos] = (state.times[state.pos] || 0) + d;
  }
  state.enterAt = 0;
}
function stampAnswer(){
  const p = state.pos;
  if (state.answers[p] && state.stopAt[p] == null) state.stopAt[p] = state.times[p] || 0;
}
function qTimeText(p){
  if (state.stopAt[p] != null) return fmtUse(state.stopAt[p]);
  if (p === state.pos && state.enterAt) return fmtUse((state.times[p]||0) + (Date.now() - state.enterAt));
  return fmtUse(state.times[p] || 0);
}

/* ============================ 首页：二级分类 ============================ */
/* ============================ 首页：分类卡片 ============================ */
function papersOf(kind){ return (kind || curBank) === 'drill' ? DRILLS : PAPERS; }
function findPaper(id){ return PAPERS.find(p => p.id === id) || DRILLS.find(p => p.id === id); }

function catsData(kind){
  const cats = [];
  for (const p of papersOf(kind)){
    let c = cats.find(x => x.cat === p.cat);
    if (!c){ c = { cat:p.cat, label:p.catLabel || p.cat, order:p.order, subs:[] }; cats.push(c); }
    let s = c.subs.find(x => x.name === (p.sub || '未分类'));
    if (!s){ s = { name:p.sub || '未分类', items:[] }; c.subs.push(s); }
    s.items.push(p);
  }
  cats.sort((a,b)=>a.order-b.order);
  return cats;
}

function catStats(c, prog){
  const n = c.subs.reduce((x,s)=>x+s.items.length,0);
  const q = c.subs.reduce((x,s)=>x+s.items.reduce((m,p)=>m+p.questions.length,0),0);
  const done = c.subs.reduce((x,s)=>x+s.items.filter(p=>prog[p.id]&&prog[p.id].finished).length,0);
  return { n, q, done, pct: n ? Math.round(done/n*100) : 0 };
}

/* ============================ 分类标识（8 类） ============================ */
const K_CATS = [
  ['politics','政治理论'],['common','常识判断'],['verbal','言语理解与表达'],['quant','数量关系'],
  ['logic','判断推理'],['data','资料分析'],['gongji','公共基础知识'],['major','专业知识'],
];
const K_LABEL = {}; K_CATS.forEach(function(x){ K_LABEL[x[0]] = x[1]; });
const K_ICON = { politics:'🚩', common:'🧭', verbal:'📖', quant:'🔢', logic:'🧩', data:'📊', gongji:'🏛', major:'🛢' };
function ktag(q){
  if (!q || !q.k || !K_LABEL[q.k]) return '';
  return '<span class="ktag ' + q.k + '">' + K_LABEL[q.k] + '</span>';
}

/* ============================ 学习统计 ============================ */
function todayStr(d){
  d = d || new Date();
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
function statsData(){
  const s = store.get(K.stats, null);
  return (s && typeof s === 'object') ? s : { total:{n:0,right:0}, days:{}, cats:{}, streak:0, lastDay:'' };
}
function recordStats(q, correct){
  if (!q || q.na === 1) return;
  const st = statsData(), t = todayStr();
  st.total = st.total || {n:0,right:0};
  st.total.n++; if (correct) st.total.right++;
  st.days = st.days || {}; st.days[t] = st.days[t] || {n:0,right:0};
  st.days[t].n++; if (correct) st.days[t].right++;
  st.cats = st.cats || {}; const kk = q.k || 'common';
  st.cats[kk] = st.cats[kk] || {n:0,right:0}; st.cats[kk].n++; if (correct) st.cats[kk].right++;
  if (st.lastDay !== t){
    const y = new Date(Date.now() - 86400000), ys = todayStr(y);
    st.streak = (st.lastDay === ys) ? (st.streak || 0) + 1 : 1;
    st.lastDay = t;
  }
  const keys = Object.keys(st.days).sort(); while (keys.length > 62) delete st.days[keys.shift()];
  store.set(K.stats, st);
}
function todayDone(){ const st = statsData(), d = st.days && st.days[todayStr()]; return d ? d.n : 0; }
function overallAcc(){ const st = statsData(); return (st.total && st.total.n) ? Math.round(st.total.right / st.total.n * 100) : 0; }
function weakestCat(minN){
  const st = statsData(); let best = null;
  for (const k of Object.keys(st.cats || {})){
    const c = st.cats[k]; if (!c.n || c.n < (minN || 5)) continue;
    const acc = c.right / c.n;
    if (!best || acc < best.acc) best = { k: k, acc: Math.round(acc*100), n: c.n };
  }
  return best;
}

/* ============================ 页面框架 / 底部导航 ============================ */
const hdEl = document.querySelector('header');
function syncChrome(){
  let hasTab = false;
  try { hasTab = !!(app && app.querySelector && app.querySelector('.tabbar')); } catch(e){}
  if (hdEl) hdEl.style.display = hasTab ? 'none' : '';
  if (typeof foot !== 'undefined' && foot) foot.style.display = hasTab ? 'none' : '';
}
function tabbar(on){
  const it = (id, ic, label) => '<button class="tabit ' + (on===id?'on':'') + '" onclick="switchTab(\'' + id + '\')"><i>' + ic + '</i>' + label + '</button>';
  return '<div class="tabbar">' + it('exam','📝','套卷模考') + it('drill','🎯','专项训练') + it('study','📖','阅读学习') + it('profile','👤','个人中心') + '</div>';
}
function tabPage(inner, active){
  const fab = active === 'profile' ? '' :
    '<button class="suan-fab" onclick="renderSuanHome()" aria-label="速算训练"><span class="sf-ico">⚡</span><span class="sf-txt">速算</span></button>';
  app.innerHTML = '<div class="app-pad">' + inner + '</div>' + fab + tabbar(active);
  syncChrome();
}
function heroTop(sub, h2, p){
  const st = statsData();
  const streak = st.streak || 0;
  return '<div class="hero2"><div class="inner">'
    + '<div class="h2top">'
    + '<div class="avatar">岸</div>'
    + '<div class="h2who"><b>Hi，同学</b><span>目标：稳过延长石油录用线' + (streak ? ' · 已坚持 ' + streak + ' 天' : '') + '</span></div>'
    + '<button class="h2btn" onclick="toast(\'暂无新消息\')">🔔</button>'
    + '</div>'

function searchBar(placeholder, kind){
  return '<div class="searchbar" onclick="openSearch(\'' + kind + '\')">🔍<span>' + placeholder + '</span></div>';
}
function featuredOf(list){
  if (!list.length) return null;
  const d = new Date();
  const seed = d.getFullYear()*372 + (d.getMonth()+1)*31 + d.getDate();
  return list[seed % list.length];
}
function randomExam(){
  const list = PAPERS.filter(p => p.questions.length > 20);
  if (!list.length) return;
  const p = list[Math.floor(Math.random()*list.length)];
  startPaper(p.id, 'exam');
  toast('随机抽到：' + p.title);
}

function openSearch(kind){
  view = 'search';
  hdTitle.textContent = kind === 'drill' ? '搜索专项' : (kind === 'study' ? '搜索资料' : '搜索套卷');

  const ph = kind === 'drill' ? '搜索专项 / 知识点 / 题型' : (kind === 'study' ? '搜索文章 / 讲义 / 专题' : '搜索套卷 / 真题 / 知识点');
  app.innerHTML = '<div class="page" style="padding-top:10px">'
    + '<div class="search-page"><input id="sinput" placeholder="' + ph + '" oninput="searchFilter(this.value,\'' + kind + '\')"></div>'
    + '<div id="sres"><div class="hint" style="margin-top:14px">输入关键词搜索：套卷名、专项题库名、题干内容、资料名</div></div></div>';
  syncChrome();
  try { setTimeout(function(){ const el = document.getElementById('sinput'); if (el && el.focus) el.focus(); }, 60); } catch(e){}
}
function searchFilter(kw, kind){
  const box = document.getElementById('sres');
  if (!box) return;
  const q = (kw || '').trim();
  if (!q){ box.innerHTML = '<div class="hint" style="margin-top:14px">输入关键词搜索：套卷名、专项题库名、题干内容、资料名</div>'; return; }
  let html = '';
  const lower = q.toLowerCase();
  if (kind === 'study'){
    const files = studyFiles();
    const hits = files.filter(function(x){ return (x.f.title + x.c.name).toLowerCase().indexOf(lower) >= 0; }).slice(0, 30);
    if (!hits.length) html = '<div class="empty">没有匹配的资料</div>';
    hits.forEach(function(x){
      html += '<button class="res-item" onclick="openMaterial(\'' + x.f.id + '\')"><div class="rt">' + esc(x.f.title) + '</div>'
        + '<div class="rm"><span class="status-pill">' + esc(x.c.name) + '</span><span>' + x.f.pages + ' 页</span></div></button>';
    });
  } else {
    const list = kind === 'drill' ? DRILLS : PAPERS;
    const sets = list.filter(function(p){ return (p.title + (p.catLabel||'') + (p.sub||'')).toLowerCase().indexOf(lower) >= 0; }).slice(0, 12);
    if (sets.length){
      html += '<div class="sec-head" style="margin-top:16px"><b>' + (kind === 'drill' ? '专项题库' : '套卷') + '</b><span>' + sets.length + ' 个</span></div>';
      sets.forEach(function(p){
        html += '<button class="res-item" onclick="openPaper(\'' + p.id + '\')"><div class="rt">' + esc(p.title) + '</div>'
          + '<div class="rm"><span class="ktag ' + (p.kcat||'common') + '">' + (K_LABEL[p.kcat] || '综合') + '</span><span>' + p.questions.length + ' 题</span><span>' + esc(p.catLabel || '') + '</span></div></button>';
      });
    }
    const qhits = [];
    for (const p of list){
      for (const qq of p.questions){
        if ((qq.q || '').indexOf(q) >= 0){ qhits.push({ p:p, q:qq }); if (qhits.length >= 20) break; }
      }
      if (qhits.length >= 20) break;
    }
    if (qhits.length){
      html += '<div class="sec-head" style="margin-top:16px"><b>题目</b><span>最多 20 条</span></div>';
      qhits.forEach(function(h){
        html += '<div class="res-item"><div class="rt">' + esc(h.q.q.slice(0, 80)) + (h.q.q.length > 80 ? '…' : '') + '</div>'
          + '<div class="rm"><span class="ktag ' + (h.q.k||'common') + '">' + (K_LABEL[h.q.k] || '') + '</span>'
          + '<span>答案 ' + (h.q.a ? esc(h.q.a) : '原卷未给') + '</span><span>' + esc(h.p.title.slice(0, 18)) + '</span></div></div>';
      });
    }
    if (!sets.length && !qhits.length) html = '<div class="empty">没有匹配结果</div>';
  }
  box.innerHTML = html;
}

/* 统计数字滚动（仅浏览器环境，测试桩件会自动跳过） */
function animateCounts(){
  if (typeof requestAnimationFrame !== 'function') return;
  if (!app || typeof app.querySelectorAll !== 'function') return;
  app.querySelectorAll('.stat b[data-n]').forEach(el => {
    const target = Number(el.getAttribute('data-n'));
    if (!isFinite(target) || target < 8) return;
    const t0 = performance.now(), dur = 560;
    const step = now => {
      const k = Math.min(1, (now - t0) / dur);
      el.textContent = Math.round(target * (1 - Math.pow(1 - k, 3)));
      if (k < 1) requestAnimationFrame(step); else el.textContent = target;
    };
    el.textContent = '0';
    requestAnimationFrame(step);
  });
}

function goHome(kind){

    if (!confirm('正在模考中，确定要离开吗？进度会保留，但计时会停止。')) return;
  }
  if (state && !state.finished) saveProgress();
  clearInterval(window.__tick); clearInterval(window.__qtick);
  state = null;
  location.hash = '';
  renderHome(kind || curBank);
}

  if (view === 'study'){ renderHome('exam'); return; }
  if (view === 'cat'){ lastCat = null; renderHome(curBank); return; }

/* ============================ 打开试卷 ============================ */
function openPaper(id){
  const paper = findPaper(id);
  if (!paper) return;
  pushHistory(paper);
  const prog = store.get(K.prog, {})[id];
  goChooseMode(paper, prog);
}
function pushHistory(paper){
  const h = store.get(K.hist, []).filter(function(x){ return x.id !== paper.id; });
  h.unshift({ id: paper.id, title: paper.title,
    kind: DRILLS.indexOf(paper) >= 0 ? 'drill' : 'exam', t: Date.now() });
  store.set(K.hist, h.slice(0, 30));
}
function isFav(q){ return store.get(K.fav, []).some(function(x){ return x.key === qHash(q); }); }
function toggleFavCurrent(){
  if (!state) return;
  const q = state.paper.questions[state.pos];
  let favs = store.get(K.fav, []);
  const key = qHash(q);
  if (favs.some(function(x){ return x.key === key; })){
    favs = favs.filter(function(x){ return x.key !== key; });
    store.set(K.fav, favs);
    toast('已取消收藏');
  } else {
    favs.unshift({ key: key, q: q.q, o: q.o, a: q.a || '', e: q.e || '', k: q.k || '',
      from: state.paper.title, t: Date.now() });
    store.set(K.fav, favs.slice(0, 300));
    toast('已收藏');
  }
  renderQuestion();
}

    <button class="btn ghost" onclick="startPaper('${paper.id}','exam')" style="width:100%">开始模考（${Math.max(10, Math.round(scorable*0.6))} 分钟）</button>

/* ============================ 开始作答 ============================ */
function startPaper(id, mode, resume){
  const paper = findPaper(id);
  if (!paper) return;
  if (DRILLS.indexOf(paper) >= 0) mode = 'practice';
  const prog = store.get(K.prog, {})[id];
  const canResume = !!(resume && prog && Object.keys(prog.answers || {}).length);
  let answers = {}, marked = {}, pos = 0, times = {}, stopAt = {}, checked = {};
  if (canResume){
    answers = prog.answers || {};
    marked = prog.marked || {};
    pos = Math.min(prog.pos || 0, paper.questions.length - 1);
    times = prog.times || {};
    stopAt = prog.stopAt || {};
    // 练习模式续做：做过的题直接显示答案与解析（已做标记）
    if (mode === 'practice') Object.keys(answers).forEach(k => { checked[k] = true; });
  }
  const n = paper.questions.length;
  const limit = Math.max(600, Math.round(n * 36));
  state = {
    mode, paper, answers, marked, pos, times, stopAt, checked,
    finished: false, startAt: Date.now(), left: limit, limit,
    aiHist: {}, enterAt: Date.now(),
  };
  view = 'q';
  location.hash = 'q';
  renderQuestion();
  if (mode === 'exam') startTimer();
  else { timerEl.style.display = 'none'; clearInterval(window.__tick); }
  if (canResume) toast(`继续上次进度：第 ${pos + 1} 题（已做 ${Object.keys(answers).length} 题）`);
}

function startTimer(){
  timerEl.style.display = 'flex';
  const tick = () => {
    if (!state || state.mode !== 'exam') return;
    const el = Math.round((Date.now() - state.startAt) / 1000);
    state.left = state.limit - el;
    timerEl.textContent = fmtClock(state.left);
    timerEl.classList.toggle('warn', state.left <= 300);
    if (state.left <= 0){ clearInterval(window.__tick); submitAll(true); }
  };
  clearInterval(window.__tick);
  tick();
  window.__tick = setInterval(tick, 500);
}

/* ============================ 题目渲染 ============================ */
const isMulti = q => q.a.length > 1;
const isRight = (chosen, a) => !!chosen && norm(chosen) === norm(a);
// 无答案题：原卷（题本版）只给了题、没给答案，只能自测，不参与判分
const isNa = q => !!(q && q.na === 1);

function renderQuestion(){
  const { paper, mode, answers, pos } = state;
  const q = paper.questions[pos];
  const total = paper.questions.length;
  const chosen = answers[pos] || '';
  const checked = (mode === 'practice' || mode === 'random') && state.checked[pos];
  const reveal = checked || state.finished;
  const na = isNa(q);                 // 无答案题：不判对错
  const showKey = reveal && !na;
  const correct = q.a;
  const multi = !na && isMulti(q);

  view = 'q';
  setBtn.style.display = 'none';
  hdTitle.textContent = paper.title;
  backBtn.style.display = 'grid';
  sheetBtn.style.display = (mode === 'random') ? 'none' : 'grid';

  const answeredCount = Object.keys(answers).length;
  let optHtml = '';
  q.o.forEach((text, i) => {
    const L = LETTERS[i];
    let cls = 'opt' + (multi ? ' multi' : '');
    if (showKey){
      if (correct.includes(L)) cls += ' right';
      else if (chosen.includes(L)) cls += ' wrong';
    } else if (chosen.includes(L)) cls += ' sel';
    optHtml += `<button class="${cls}" ${reveal?'disabled':''} onclick="pick(${i})">
      <span class="k">${L}</span><span class="v">${esc(text)}</span></button>`;
  });

  const frozen = state.stopAt[pos] != null;
  const timeTxt = qTimeText(pos);
  let fbh = '';
  if (na && reveal){
    fbh = `<div class="fb show na">
      <div class="ttl">本题原卷没有答案<span class="tm">⏱ 本题用时 ${timeTxt}</span></div>
      <div>这道题来自「题本版」源文件，原卷只给了题目、没给答案，所以不判对错、也不计入得分${chosen ? `。你选的是 <b>${chosen}</b>` : ''}。</div>
      <div class="ex">想知道答案，可以点下面的「AI 解析」让它讲解并给出答案；答案以你手头的原卷为准。</div>
    </div>`;
  } else if (reveal){
    const ok = isRight(chosen, correct);
    fbh = `<div class="fb show ${ok?'ok':'bad'}">
      <div class="ttl">${ok ? '✓ 回答正确' : (chosen ? '✗ 回答错误' : '未作答')}
        <span class="tm">⏱ 本题用时 ${timeTxt}</span></div>
      <div>正确答案：<b>${correct}</b>${chosen && !ok ? ` ｜ 你的答案：<b>${chosen}</b>` : ''}</div>
      ${q.p ? `<div class="proc"><div class="pt">解题过程 · 补全</div>${esc(q.p)}</div>` : ''}
      ${q.e ? `<div class="ex">【解析】${q.mf ? '<span class="tagfill">补全</span>' : ''}${esc(q.e)}</div>` : ''}
      ${!q.e && q.bq ? `<div class="ex">原卷解析中的公式/图形是图片，没能提取成文字，整段残文已隐藏。
        <details><summary>查看原始残文</summary><div class="raw">${esc(q.re || '')}</div></details></div>` : ''}
    </div>`;
  }

  const aiBlock = (reveal || na) ? renderAIBlock(q) : '';
  const progress = Math.round(answeredCount / total * 100);

  const rightCount = Object.keys(state.checked || {}).filter(i => {
    const qq = paper.questions[i];
    return qq && !isNa(qq) && isRight(answers[i], qq.a);
  }).length;
  const sideCard = `<div class="panel side">
    <div class="ttl">本${mode === 'random' ? '轮' : '套'}进度</div>
    <div><div class="kv2"><span>${mode === 'random' ? '已做' : '已答'}</span><b>${answeredCount}${mode === 'random' ? '' : ' / ' + total}</b></div>
    <div class="kv2"><span>答对</span><b style="color:var(--ok)">${rightCount}</b></div>
    <div class="kv2"><span>本题用时</span><b id="qtime2">${timeTxt}</b></div>
    <div class="kv2"><span>模式</span><b>${mode==='exam'?'模考':mode==='random'?'随机':'练习'}</b></div>
    ${mode === 'random' ? '' : `<button class="btn ghost" style="width:100%;height:40px;margin-top:10px" onclick="toggleSheet()">打开答题卡</button>`}
  </div></div>`;

  app.innerHTML = `
  <div class="q-layout">
  <div class="panel">
    <div class="pbar" style="margin-top:0"><i style="width:${progress}%"></i></div>
    <div class="qhead">
      <span class="pos">${mode === 'random' ? `第 ${pos+1} 题` : `第 ${pos+1} / ${total} 题`}</span>
      ${mode === 'random' ? `<span class="rndbar">已做 <b>${state.done||0}</b> · 对 <b style="color:var(--ok)">${state.right||0}</b> · 错 <b style="color:var(--bad)">${state.wrong||0}</b></span>` : ''}
      <span class="chip ${(!frozen && !state.finished) ? 'live' : ''}" id="qtime">⏱ ${timeTxt}</span>
      <span class="badge ${na ? 'na' : (showKey ? (isRight(chosen,correct)?'ok':'bad') : '')}">${mode==='exam'?'模考':mode==='random'?'随机':'练习'}${na?' · 无答案':(multi?' · 多选':'')}</span>
      ${answers[pos] ? `<span class="badge done">✓ 已做</span>` : ''}
      ${ktag(q)}
      <button class="favbtn ${isFav(q) ? 'on' : ''}" onclick="toggleFavCurrent()" title="收藏本题">${isFav(q) ? '★' : '☆'}</button>
    </div>
    ${q.from ? `<div class="hint" style="margin-bottom:6px">出自：${esc(q.from)}</div>` : ''}\n    <div class="qtext">${esc(q.q)}</div>
    <div class="opts">${optHtml}</div>
    ${multi && !reveal ? `<div class="hint" style="margin-top:10px">本题为多选题，可选多项，选好后点「确定」</div>
      <button class="btn primary" style="width:100%;margin-top:10px" onclick="confirmMulti()" ${chosen?'':'disabled'}>确定</button>` : ''}
    ${fbh}
    ${aiBlock}
  </div>
  ${sideCard}
  </div>
  <div class="navbar">
    <button class="btn ghost" onclick="move(-1)" ${pos===0?'disabled':''}>上一题</button>
    ${mode === 'random'
      ? `<button class="btn primary" onclick="nextRandom()">下一题</button>
         <button class="btn ghost" style="flex:0 0 84px" onclick="endRandom()">结束</button>`
      : (pos === total-1
        ? `<button class="btn primary" onclick="submitAll(false)">${mode==='exam'?'交卷':'查看结果'}</button>`
        : `<button class="btn primary" onclick="move(1)">下一题</button>`)}
  </div>`;

  // 单题计时器：未作答时实时跳动
  clearInterval(window.__qtick);
  state.enterAt = Date.now();
  if (!frozen && !state.finished){
    window.__qtick = setInterval(() => {
      const el = document.getElementById('qtime');
      if (!el || !state || state.pos !== pos) return;
      el.textContent = '⏱ ' + qTimeText(pos);
    }, 500);
  }
  // 恢复已缓存的 AI 解析
  if (reveal && !q.e) restoreAI(q);
}

function pick(i){
  if (!state || state.finished) return;
  accrue();
  const { pos } = state;
  const q = state.paper.questions[pos];
  const L = LETTERS[i];

  if (isMulti(q)){
    const cur = (state.answers[pos] || '').split('');
    const at = cur.indexOf(L);
    if (at >= 0) cur.splice(at, 1); else cur.push(L);
    state.answers[pos] = cur.sort().join('');
    saveProgress();
    renderQuestion();
    return;
  }

  const firstPick = !state.answers[pos];
  state.answers[pos] = L;
  if (state.mode === 'practice' || state.mode === 'random'){
    state.checked[pos] = true;
    if (isNa(q)){
      // 无答案题：只记选项、不判对错、不进错题本、不计入随机刷题的正确/错误
      if (state.mode === 'random' && firstPick) state.done = (state.done || 0) + 1;
    } else {
      if (firstPick) recordStats(q, isRight(L, q.a));
      recordWrong(state.paper, q, L);
      if (state.mode === 'random' && firstPick){
        state.done = (state.done || 0) + 1;
        if (isRight(L, q.a)) state.right = (state.right || 0) + 1;
        else state.wrong = (state.wrong || 0) + 1;
      }
    }
  }
  stampAnswer();
  saveProgress();
  if (state.mode === 'random') saveRandom();
  renderQuestion();
}

function confirmMulti(){
  if (!state) return;
  accrue();
  const { pos } = state;
  const q = state.paper.questions[pos];
  if (!state.answers[pos]) return;
  const firstPick = !state.checked[pos];
  if (state.mode === 'practice' || state.mode === 'random'){
    state.checked[pos] = true;
    recordWrong(state.paper, q, state.answers[pos]);
    if (!isNa(q)) recordStats(q, isRight(state.answers[pos], q.a));
    if (state.mode === 'random' && firstPick){
      state.done = (state.done || 0) + 1;
      if (isRight(state.answers[pos], q.a)) state.right = (state.right || 0) + 1;
      else state.wrong = (state.wrong || 0) + 1;
    }
  }
  stampAnswer();
  saveProgress();
  if (state.mode === 'random') saveRandom();
  renderQuestion();
}

function move(d){
  const n = state.paper.questions.length;
  const np = state.pos + d;
  if (np < 0 || np >= n) return;
  accrue();
  state.pos = np;
  saveProgress();
  if (state.mode === 'random') saveRandom();
  renderQuestion();
}

function saveProgress(){
  if (!state) return;
  if (state.paper.id === '__random__'){ saveRandom(); return; }   // 随机刷题的进度单独存
  const prog = store.get(K.prog, {});
  const id = state.paper.id;
  const prev = prog[id] || {};
  prog[id] = {
    answers: state.answers, marked: state.marked, pos: state.pos,
    times: state.times, stopAt: state.stopAt,
    finished: state.finished,
    score: state.finished ? (state.score || 0) : (prev.score || 0),
    updated: Date.now(),
  };
  store.set(K.prog, prog);
}

/* ============================ 错题本 ============================ */
function recordWrong(paper, q, chosen){
  if (paper.id === '__wrong__') return;
  if (isNa(q)) return;                 // 无答案题没有对错，不进错题本
  let w = store.get(K.wrong, []);
  const key = paper.id + '#' + qHash(q);
  const hit = w.find(x => x.key === key);
  if (isRight(chosen, q.a)){
    if (hit) w = w.filter(x => x.key !== key);
  } else if (hit){
    hit.t = Date.now(); hit.c = chosen;
  } else {
    w.push({ key, paper: paper.id, pt: paper.title, n: q.n, q: q.q, o: q.o, a: q.a, e: q.e, c: chosen, t: Date.now() });
  }
  store.set(K.wrong, w);
}

/* ============================ 随机抽题 ============================ */
function shuffle(a){
  for (let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function randomTotal(){
  return PAPERS.reduce((n,p)=>n+p.questions.length,0) + DRILLS.reduce((n,p)=>n+p.questions.length,0);
}

function randomPool(){
  // 随机刷题覆盖全部题库：套卷模考 + 专项练习
  const pool = [];
  for (const p of PAPERS) for (const q of p.questions) pool.push({ p, q });
  for (const p of DRILLS) for (const q of p.questions) pool.push({ p, q });
  return pool;
}

function drawOne(){
  // 优先抽没出现过的题；题库里同一道题可能出现在多套卷中，按题干去重
  const pool = randomPool();
  if (!state.drawn) state.drawn = new Set();
  if (!state.bag || !state.bag.length) state.bag = shuffle(pool.slice());

  let item = null;
  while (state.bag.length){
    const cand = state.bag.pop();
    if (!state.drawn.has(cand.q.q)){ item = cand; break; }
  }
  if (!item){
    // 本轮全部抽过一遍，重置后再抽
    state.drawn = new Set();
    state.bag = shuffle(pool.slice());
    while (state.bag.length){
      const cand = state.bag.pop();
      if (!state.drawn.has(cand.q.q)){ item = cand; break; }
    }
  }
  if (!item) item = { p: { title: '' }, q: pool[0].q };

  const isDrill = DRILLS.indexOf(item.p) >= 0;
  const q = Object.assign({}, item.q, { from: (isDrill ? '专项 · ' : '套卷 · ') + item.p.title });
  state.drawn.add(q.q);
  state.paper.questions.push(q);
  return q;
}

function randomSaved(){
  const d = store.get(K.random, null);
  return (d && d.questions && d.questions.length) ? d : null;
}

  });
}

function startRandom(resume){
  const saved = resume ? randomSaved() : null;

    state = {
      mode: 'random',
      paper: { id:'__random__', title:'随机刷题', catLabel:'随机刷题', sub:'全部题库', questions:saved.questions },
      answers: saved.answers || {}, marked: {}, pos: saved.pos || 0,
      times: saved.times || {}, stopAt: saved.stopAt || {}, finished: false,
      checked: saved.checked || {}, aiHist: {}, startAt: Date.now(), left: 0, limit: 0, enterAt: Date.now(),
      drawn: new Set(saved.drawn || []), bag: null,
      done: saved.done || 0, right: saved.right || 0, wrong: saved.wrong || 0,
    };
    while (state.paper.questions.length <= state.pos + 1) drawOne();
    if (state.pos >= state.paper.questions.length) state.pos = state.paper.questions.length - 1;
  } else {
    store.del(K.random);
    state = {
      mode: 'random',
      paper: { id:'__random__', title:'随机刷题', catLabel:'随机刷题', sub:'全部题库', questions: [] },
      answers:{}, marked:{}, pos:0, times:{}, stopAt:{}, finished:false,

function toggleSheet(){
  if (!state) return;
  accrue();
  const { paper, answers, pos, finished } = state;
  const n = paper.questions.length;
  let cells = '';
  for (let i=0;i<n;i++){
    const L = answers[i];
    const na = isNa(paper.questions[i]);
    let cls = 'cell' + (na ? ' na' : '');
    if (L) cls += ' done';
    if (finished) cls = 'cell' + (na ? ' na' : ' ' + (isRight(L, paper.questions[i].a) ? 'ok' : 'bad'));
    if (i === pos) cls += ' cur';
    const t = state.stopAt[i] != null ? state.stopAt[i] : state.times[i];
    const tip = (t != null ? `第 ${i+1} 题 · 用时 ${fmtUse(t)}` : `第 ${i+1} 题`) + (na ? '（原卷无答案）' : '');
    cells += `<button class="${cls}" title="${tip}" onclick="jump(${i})">${i+1}</button>`;
  }
  const answered = Object.keys(answers).length;
  const totalMs = Object.values(state.times).reduce((a,b)=>a+b,0);

/* ============================ 交卷 ============================ */
let lastResult = null;

function submitAll(auto){
  if (!state) return;
  accrue();
  const { paper, mode, answers } = state;
  const n = paper.questions.length;
  const answered = Object.keys(answers).length;
  if (!auto && mode === 'exam' && answered < n){
    if (!confirm(`还有 ${n-answered} 题未作答，确定交卷？`)) return;
  }
  clearInterval(window.__tick); clearInterval(window.__qtick);

  let right = 0, wrong = 0, blank = 0, na = 0;
  paper.questions.forEach((q, i) => {
    const a = answers[i];
    if (isNa(q)){ na++; return; }      // 无答案题不计分
    if (!a) blank++;
    else if (isRight(a, q.a)) right++;
    else { wrong++; recordWrong(paper, q, a); }
  });
  const scorable = Math.max(0, n - na);
  const score = scorable ? Math.round(right / scorable * 100) : 0;
  const totalMs = Object.values(state.times).reduce((a,b)=>a+b,0);
  state.finished = true;
  state.score = score;
  saveProgress();
  lastResult = { n, right, wrong, blank, score, auto, totalMs, na, scorable,
    avgMs: answered ? Math.round(totalMs / answered) : 0 };
  renderResult(lastResult);
}

/* 数学/排版：把模型常输出的 LaTeX 与 Markdown 转成可读 HTML（无外部依赖） */
const SYM = {
  '\\times':'×', '\\div':'÷', '\\cdot':'·', '\\approx':'≈', '\\leq':'≤', '\\le':'≤',
  '\\geq':'≥', '\\ge':'≥', '\\neq':'≠', '\\ne':'≠', '\\pm':'±', '\\mp':'∓',
  '\\pi':'π', '\\alpha':'α', '\\beta':'β', '\\theta':'θ', '\\lambda':'λ', '\\mu':'μ',
  '\\rightarrow':'→', '\\to':'→', '\\Rightarrow':'⇒', '\\leftarrow':'←',
  '\\therefore':'∴', '\\because':'∵', '\\angle':'∠', '\\triangle':'△',
  '\\infty':'∞', '\\sum':'∑', '\\in':'∈', '\\notin':'∉', '\\subset':'⊂',
  '\\cup':'∪', '\\cap':'∩', '\\circ':'°', '\\%':'%', '\\$':'$', '\\&':'&',
  '\\lfloor':'⌊', '\\rfloor':'⌋', '\\lceil':'⌈', '\\rceil':'⌉',
  '\\mid':'|', '\\vert':'|', '\\parallel':'∥', '\\perp':'⊥',
  '\\cdots':'…', '\\ldots':'…', '\\dots':'…', '\\quad':' ', '\\qquad':'  ',
};

function readGroup(s, i){
  if (s[i] !== '{') return null;
  let depth = 0;
  for (let j = i; j < s.length; j++){
    if (s[j] === '{') depth++;
    else if (s[j] === '}'){ depth--; if (depth === 0) return { text: s.slice(i+1, j), end: j+1 }; }
  }
  return null;
}

function latexToHtml(src){
  let out = src.replace(/\\[dt]frac/g, '\\frac'), guard = 0;
  // \frac{a}{b} —— 递归，支持嵌套
  while (out.includes('\\frac') && guard++ < 60){
    const i = out.indexOf('\\frac');
    const a = readGroup(out, i + 5);
    if (!a) break;
    const b = readGroup(out, a.end);
    if (!b) break;
    const num = latexToHtml(a.text);
    const den = latexToHtml(b.text);
    out = out.slice(0, i)
      + '<span class="frac"><span class="num">' + num + '</span><span class="den">' + den + '</span></span>'
      + out.slice(b.end);
  }
  // \sqrt{x}、\text{...}、\mathrm{...}
  out = out.replace(/\\sqrt\s*\{([^{}]*)\}/g, (m, a) => '√(' + latexToHtml(a) + ')');
  out = out.replace(/\\text\s*\{([^{}]*)\}/g, (m, a) => a);
  out = out.replace(/\\mathrm\s*\{([^{}]*)\}/g, (m, a) => a);
  // 上下标
  out = out.replace(/\^\{([^{}]*)\}/g, (m, a) => '<sup>' + a + '</sup>');
  out = out.replace(/\^([0-9A-Za-z])/g, (m, a) => '<sup>' + a + '</sup>');
  out = out.replace(/_\{([^{}]*)\}/g, (m, a) => '<sub>' + a + '</sub>');
  out = out.replace(/_([0-9A-Za-z])/g, (m, a) => '<sub>' + a + '</sub>');
  // \left( \right) 先剥离（必须在符号替换之前，否则 \le 会吃掉 \left）
  out = out.replace(/\\(left|right)(?=\s*[()\[\]{}|.<])/g, '');
  // 符号表（长的先替换，避免 \le 吃掉 \leq、\ne 吃掉 \neq）
  for (const k of Object.keys(SYM).sort((a,b)=>b.length-a.length)){
    out = out.split(k).join(SYM[k]);
  }
  // 剩余命令与结构符
  out = out.replace(/\\(displaystyle|textstyle|limits|,|;|:|!)/g, '');
  out = out.replace(/\\\\/g, '<br>');
  out = out.replace(/[{}]/g, '');
  return out;
}

/* 去掉模型可能夹带的思考过程/草稿 */
function stripThinking(src){
  let t = String(src || '');
  // 1) 标签式：<thought>…</thought>、…</thought>、<reasoning>…</reasoning>
  t = t.replace(/<(think|thought|reasoning|analysis|scratchpad|reflection)>[\s\S]*?<\/\1>/gi, '');
  // 只有闭合标签（开标签被截断）时，丢弃闭合标签之前的内容
  t = t.replace(/^[\s\S]*?<\/(think|thought|reasoning)>/i, '');
  t = t.replace(/```(?:think|thought|reasoning)[\s\S]*?```/gi, '');
  // 2) 开头的「思考过程：」「分析：」整段（到空行或到解析标题）
  t = t.replace(/^[ \t]*(?:思考过程|思维过程|推理过程|分析过程|我的思考|思路分析)[ \t]*[:：][\s\S]*?(?:\n[ \t]*\n|$)/, '');
  // 3) 前言太长又出现「解析/答案」标题时，从标题处截取
  const m = t.match(/(?:【解析】|【答案】|\n[ \t]*(?:解析|答案|解答|正确答案)[ \t]*[:：])/);
  if (m && m.index > 60) t = t.slice(m.index);
  // 4) 客套开场
  t = t.replace(/^[ \t]*(?:好的|好|明白|当然|没问题)[，,。！!\s]*(?:我们|下面|接下来)?[^\n]{0,20}[：:，,]\s*/,'');
  return t.trim();
}

function renderRich(src){
  let s = esc(String(src || ''));
  // 块级公式
  s = s.replace(/\\\[([\s\S]*?)\\\]/g, (m, x) => '<div class="mathblock">' + latexToHtml(x) + '</div>');
  s = s.replace(/\$\$([\s\S]*?)\$\$/g, (m, x) => '<div class="mathblock">' + latexToHtml(x) + '</div>');
  // 行内公式
  s = s.replace(/\\\(([\s\S]*?)\\\)/g, (m, x) => '<span class="math">' + latexToHtml(x) + '</span>');
  s = s.replace(/(^|[^\\$])\$([^\$\n]+?)\$/g, (m, p, x) => p + '<span class="math">' + latexToHtml(x) + '</span>');
  // Markdown 粗体与代码
  s = s.replace(/\*\*([^*\n]+)\*\*/g, '<b>$1</b>');
  s = s.replace(/`([^`\n]+)`/g, '<code>$1</code>');
  // 列表
  s = s.replace(/(^|\n)[ ]*[-*•][ ]+/g, '$1• ');
  // 换行
  s = s.replace(/\r/g, '').replace(/\n/g, '<br>');
  return s;
}

function aiCfg(){ return store.get(K.ai, null); }

/* 缓存键按「题目内容」生成，而不是按原卷题号：
   错题本会把不同套卷的题混在一起，题号会重复；同一套里题号也可能被重排。
   用题干+选项+答案的哈希，能保证一条缓存只对应一道题。 */
function qHash(q){
  const s = (q.q || '') + '|' + (q.o || []).join('|') + '|' + (q.a || '');
  let h = 2166136261;
  for (let i = 0; i < s.length; i++){
    h ^= s.charCodeAt(i);
    h = Math.imul(h, 16777619);
  }
  return (h >>> 0).toString(36);
}
function aiKeyOf(paperId, q){ return paperId + '#' + qHash(q); }
function aiCacheAll(){ return store.get(K.aiCache, {}) || {}; }
function aiCacheGet(k){ return aiCacheAll()[k] || ''; }
function aiCacheSet(k, v){ const c = aiCacheAll(); c[k] = v; store.set(K.aiCache, c); }

function buildPrompt(q){
  const opts = q.o.map((t,i)=>`${LETTERS[i]}. ${t}`).join('\n');
  return `题目：${q.q}\n\n选项：\n${opts}\n\n标准答案：${q.a}\n\n请给出解析。`;
}

/* 外部搜题：跳华图题库（浏览器直接打开，不受本地文件跨域限制） */
function huatuKeyword(q){
  // 华图是分词模糊匹配：关键词过长会直接返回空，保留数字更利于区分
  const s = String(q.q || '')
    .replace(/[，。？！、；：“”‘’（）《》〈〉…—\-\s,\.\?!"'()\[\]]/g, '');
  return s.slice(0, 12);
}
function huatuUrl(q){
  return 'https://v.huatu.com/tiku/searchquestion?keyword=' + encodeURIComponent(huatuKeyword(q));
}

  return `<div class="ai">

      <button class="mini" onclick="openSettings()">${configured ? '模型设置' : '未配置 · 去设置'}</button>
    </div>
    ${hasOfficial ? `<div class="hint" style="margin-top:4px">本题已有${q.e ? '原卷解析' : '补全过程'}；若想换个讲法或追问细节，可让 AI 再讲一遍。</div>` : ''}
    <div class="ai-out ${cached?'show':''}" id="aiOut">${cached ? renderRich(cached) : ''}</div>
    <div class="ai-warn" id="aiWarn"></div>
    ${cached ? `<div class="ai-tools"><button onclick="copyAI()">复制解析</button></div>` : `<button class="btn primary" style="width:100%;margin-top:9px;height:40px;font-size:14px" onclick="runAI()">${btnLabel}</button>`}
    ${cached ? `<div class="ai-row"><input id="aiInput" placeholder="继续追问，例如：为什么不选 B？" onkeydown="if(event.key==='Enter')runAI(this.value)"><button onclick="runAI(document.getElementById('aiInput').value)">追问</button></div>` : ''}
    <div class="ai-links">
      <a class="linkbtn" href="${huatuUrl(q)}" target="_blank" rel="noreferrer noopener">去华图搜这题（自行比对）↗</a>
    </div>
    <div class="ai-err" id="aiErr" style="display:none"></div>
  </div>`;
}

function restoreAI(q){
  const key = aiKeyOf(state.paper.id, q);
  const cached = aiCacheGet(key);
  const out = document.getElementById('aiOut');
  if (out && cached){ out.innerHTML = renderRich(cached); out.classList.add('show'); }
}

function copyAI(){
  const out = document.getElementById('aiOut');
  if (!out) return;
  const t = out.innerText || out.textContent || '';
  if (navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(t).then(()=>toast('已复制'), ()=>toast('复制失败'));
  } else {
    const ta = document.createElement('textarea');
    ta.value = t; document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); toast('已复制'); } catch(e){ toast('复制失败'); }
    ta.remove();
  }
}

async function callChat(cfg, messages){
  const ac = new AbortController();
  const to = setTimeout(() => ac.abort(), 120000);
  try {
    const res = await fetch((cfg.base || '').replace(/\/+$/,'') + '/chat/completions', {
      method: 'POST',
      headers: Object.assign(
        { 'Content-Type': 'application/json' },
        cfg.key ? { 'Authorization': 'Bearer ' + cfg.key } : {}
      ),
      body: JSON.stringify({ model: cfg.model, messages, temperature: 0.3, max_tokens: 3000 }),
      signal: ac.signal,
    });
    if (!res.ok){
      const txt = await res.text().catch(()=> '');
      throw new Error(`接口返回 ${res.status}${res.status===401?'（Key 无效或未授权）':res.status===404?'（地址或模型名不对）':res.status===429?'（调用太频繁/额度不足）':''}\n${txt.slice(0,300)}`);
    }
    const data = await res.json();
    const choice = data?.choices?.[0];
    const answer = choice?.message?.content;
    if (!answer) throw new Error('接口没有返回内容，请检查模型名是否支持对话接口');
    return { text: answer, truncated: choice.finish_reason === 'length' };
  } finally {
    clearTimeout(to);
  }
}

async function runAI(follow, cont){
  const cfg = aiCfg();
  if (!cfg || !cfg.base || !cfg.model){ toast('请先配置大模型接口'); openSettings(); return; }
  const { paper, pos } = state;
  const q = paper.questions[pos];
  const out = document.getElementById('aiOut');
  const err = document.getElementById('aiErr');
  const warn = document.getElementById('aiWarn');
  if (!out) return;

  if (err){ err.style.display = 'none'; err.textContent = ''; }
  if (warn) warn.classList.remove('show');
  out.classList.add('show');

  if (!state.aiHist[pos]) state.aiHist[pos] = [{ role:'system', content:SYS_PROMPT }];
  if (!state.aiRaw) state.aiRaw = {};
  const hist = state.aiHist[pos];
  if (hist.length === 1) hist.push({ role:'user', content: buildPrompt(q) });

  if (cont){
    hist.push({ role:'user', content:'上一条回答被长度限制截断了。请从中断处接着写剩余内容，不要重复已经写过的部分，也不要重新开头。' });
  } else if (follow && String(follow).trim()){
    hist.push({ role:'user', content: String(follow).trim() });
  }

  out.innerHTML = '<span class="spin"></span> 正在请求模型…';
  try {
    const { text: rawText, truncated } = await callChat(cfg, hist);
    const text = stripThinking(rawText) || rawText;
    hist.push({ role:'assistant', content: text });

    const prevRaw = cont ? (state.aiRaw[pos] || '') : '';
    const raw = prevRaw ? prevRaw.replace(/\s+$/, '') + '\n' + text : text;
    state.aiRaw[pos] = raw;
    aiCacheSet(aiKeyOf(paper.id, q), raw);

    // 请求期间用户可能已切到别的题：那时只写缓存，不动界面，避免把本题解析画到别的题上
    const stillHere = () => state && state.paper.id === paper.id
      && state.paper.questions[state.pos] === q
      && document.getElementById('aiOut') === out;
    if (!stillHere()) return;

    out.innerHTML = renderRich(raw);

    if (truncated){
      out.innerHTML += '<div class="ai-warn show">⚠ 回答达到长度上限，已截断。' +
        '<button class="preset" style="margin-left:8px" onclick="runAI(null,true)">继续生成</button></div>';
    }

    // 生成后补上追问与复制入口
    const host = out.parentElement;
    if (host){
      if (!host.querySelector('.ai-row')){
        const div = document.createElement('div');
        div.className = 'ai-row';
        div.innerHTML = `<input id="aiInput" placeholder="继续追问，例如：为什么不选 B？" onkeydown="if(event.key==='Enter')runAI(this.value)"><button onclick="runAI(document.getElementById('aiInput').value)">追问</button>`;
        host.appendChild(div);
      }
      const btn = host.querySelector('button.btn.primary');
      if (btn) btn.remove();
      if (!host.querySelector('.ai-tools')){
        const tools = document.createElement('div');
        tools.className = 'ai-tools';
        tools.innerHTML = '<button onclick="copyAI()">复制解析</button>';
        host.appendChild(tools);
      }
    }
  } catch (e) {
    const msg = e.name === 'AbortError' ? '请求超时（120 秒），可稍后重试'
      : /Failed to fetch|NetworkError|Load failed/i.test(e.message)
        ? '无法连接接口：可能是地址写错、断网，或该接口不允许浏览器直接跨域访问（CORS）'
        : e.message;
    out.classList.remove('show');
    if (err){ err.style.display = 'block'; err.textContent = '⚠ ' + msg; }
  }
}
